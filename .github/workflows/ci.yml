name: ci

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  analyze-and-test:
    # 开发机是 Windows，且 flutter_inappwebview_windows 需要 WebView2 SDK，
    # 直接用 windows runner 与本地保持一致。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded
